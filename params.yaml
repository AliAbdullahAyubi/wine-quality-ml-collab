seed: 42

data:
  raw_path: data/raw/winequality-red.csv
  processed_path: data/processed/winequality.csv
  target: quality

split:
  test_size: 0.2




train:
  model: random_forest
  n_estimators: 100
  max_depth: 8
  min_samples_split: 2
  min_samples_leaf: 1

evaluate:
  metrics_path: metrics/metrics.json

model:
  path: models/model.pkl