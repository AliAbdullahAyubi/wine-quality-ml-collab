stages:

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/winequality-red.csv
    params:
      - seed
      - data
      - split
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/train.csv
    params:
      - seed
      - train
      - model
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - data/processed/test.csv
      - models/model.pkl
    params:
      - evaluate
    metrics:
      - metrics/metrics.json
      